[project]
name = "simple-detect-secrets"
dynamic = ["version"]
description = "Tool for detecting secrets in the codebase"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Malthe Jørgensen", email = "malthe.jorgensen@gmail.com" },
]
keywords = ["secret-management", "pre-commit", "security", "entropy-checks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
]
dependencies = ["pyyaml", "requests"]

[project.optional-dependencies]
word_list = ["pyahocorasick"]

[project.scripts]
simple-detect-secrets = "simple_detect_secrets.main:main"

[project.urls]
Homepage = "https://github.com/malthejorgensen/simple-detect-secrets"

[dependency-groups]
dev = [
    "coverage",
    "flake8",
    "mock",
    "monotonic",
    "pre-commit",
    "pyahocorasick",
    "pytest",
    "responses",
    "tox",
    "unidiff",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "simple_detect_secrets.VERSION" }

[tool.setuptools.packages.find]
include = ["simple_detect_secrets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
exclude-newer = "2 weeks"

[tool.ruff.format]
quote-style = "single"
